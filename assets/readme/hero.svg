<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">CarRadioWeb — Automotive Electronics Knowledge Base</title>
  <desc id="hero-desc">Product showcase, technical documentation, AI assistant, and admin panel for car head units, CarPlay, and Android Auto systems.</desc>

  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080C18"/>
      <stop offset="100%" stop-color="#0F1630"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#3388FF"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF9500"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>
    <linearGradient id="card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141C3A"/>
      <stop offset="100%" stop-color="#101830"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse" opacity="0.08">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3388FF" stroke-width="0.5"/>
    </pattern>
    <clipPath id="screen-clip">
      <rect x="770" y="50" width="390" height="290" rx="12"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Left section: Title block -->
  <g transform="translate(56, 40)">
    <!-- Category badge -->
    <rect x="0" y="0" width="160" height="28" rx="14" fill="#0066FF" opacity="0.2"/>
    <text x="80" y="19" text-anchor="middle" fill="#3388FF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">Automotive Electronics</text>

    <!-- Project name -->
    <text x="0" y="76" fill="#F0F4FF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="52" font-weight="700" letter-spacing="-0.5">CarRadioWeb</text>

    <!-- Tagline -->
    <text x="0" y="118" fill="#8899C4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="400" letter-spacing="0.2">Modern knowledge base &amp; product showcase</text>
    <text x="0" y="144" fill="#8899C4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="400">for car infotainment brands</text>

    <!-- Feature pills -->
    <g transform="translate(0, 180)">
      <rect x="0" y="0" width="110" height="30" rx="6" fill="#141C3A" stroke="#1E2A50" stroke-width="1"/>
      <circle cx="18" cy="15" r="4" fill="#0066FF"/>
      <text x="30" y="20" fill="#99AAD4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="500">Products</text>

      <rect x="124" y="0" width="100" height="30" rx="6" fill="#141C3A" stroke="#1E2A50" stroke-width="1"/>
      <circle cx="142" cy="15" r="4" fill="#0066FF"/>
      <text x="148" y="20" fill="#99AAD4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="500">Knowledge</text>

      <rect x="238" y="0" width="80" height="30" rx="6" fill="#141C3A" stroke="#1E2A50" stroke-width="1"/>
      <circle cx="256" cy="15" r="4" fill="#FF9500"/>
      <text x="262" y="20" fill="#99AAD4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="500">AI Assist</text>
    </g>

    <!-- Repo link -->
    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="195" height="36" rx="8" fill="#141C3A" stroke="#1E2A50" stroke-width="1"/>
      <text x="16" y="23" fill="#F0F4FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">github.com/Leolty0511/CarRadioWeb</text>
    </g>
  </g>

  <!-- Right section: Mock admin interface -->
  <g transform="translate(770, 50)">
    <!-- Screen frame -->
    <rect x="0" y="0" width="390" height="290" rx="12" fill="#0A0E17" stroke="#1E2A50" stroke-width="1.5"/>

    <!-- Title bar -->
    <rect x="0" y="0" width="390" height="46" rx="12" fill="#101830"/>
    <rect x="0" y="30" width="390" height="16" fill="#101830"/>
    <circle cx="20" cy="23" r="5" fill="#FF5F56"/>
    <circle cx="38" cy="23" r="5" fill="#FFBD2E"/>
    <circle cx="56" cy="23" r="5" fill="#27C93F"/>
    <text x="195" y="28" text-anchor="middle" fill="#8899C4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="500">Admin Panel</text>

    <!-- Sidebar -->
    <rect x="0" y="46" width="90" height="244" fill="#0C1128"/>
    <rect x="80" y="46" width="1" height="244" fill="#1E2A50"/>

    <!-- Sidebar items -->
    <rect x="10" y="62" width="70" height="24" rx="4" fill="#0066FF" opacity="0.15"/>
    <text x="45" y="78" text-anchor="middle" fill="#3388FF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="600">Dashboard</text>

    <text x="45" y="108" text-anchor="middle" fill="#5A6B94" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="500">Products</text>
    <text x="45" y="130" text-anchor="middle" fill="#5A6B94" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="500">Documents</text>
    <text x="45" y="152" text-anchor="middle" fill="#5A6B94" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="500">AI Config</text>
    <text x="45" y="174" text-anchor="middle" fill="#5A6B94" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="500">Analytics</text>
    <text x="45" y="196" text-anchor="middle" fill="#5A6B94" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="500">Settings</text>

    <!-- Main content area -->
    <rect x="104" y="60" width="272" height="40" rx="6" fill="#141C3A"/>
    <text x="120" y="82" fill="#99AAD4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">Dashboard</text>

    <!-- Stat cards -->
    <rect x="104" y="112" width="86" height="50" rx="6" fill="#141C3A" stroke="#1E2A50" stroke-width="0.5"/>
    <text x="118" y="132" fill="#5A6B94" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="9">Products</text>
    <text x="118" y="152" fill="#F0F4FF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">24</text>

    <rect x="200" y="112" width="86" height="50" rx="6" fill="#141C3A" stroke="#1E2A50" stroke-width="0.5"/>
    <text x="214" y="132" fill="#5A6B94" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="9">Documents</text>
    <text x="214" y="152" fill="#F0F4FF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">156</text>

    <rect x="296" y="112" width="80" height="50" rx="6" fill="#141C3A" stroke="#1E2A50" stroke-width="0.5"/>
    <text x="310" y="132" fill="#5A6B94" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="9">Visitors</text>
    <text x="310" y="152" fill="#F0F4FF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">1.2K</text>

    <!-- Recent activity list -->
    <rect x="104" y="174" width="272" height="108" rx="6" fill="#141C3A" stroke="#1E2A50" stroke-width="0.5"/>
    <text x="118" y="192" fill="#99AAD4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="600">Recent Activity</text>

    <rect x="118" y="204" width="6" height="6" rx="3" fill="#0066FF"/>
    <text x="134" y="212" fill="#7A8BB4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10">New product: CarPlay 10&quot; Pro</text>

    <rect x="118" y="222" width="6" height="6" rx="3" fill="#FF9500"/>
    <text x="134" y="230" fill="#7A8BB4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10">Document updated: Installation Guide</text>

    <rect x="118" y="240" width="6" height="6" rx="3" fill="#0066FF"/>
    <text x="134" y="248" fill="#7A8BB4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10">New AI Q&amp;A session on Android Auto</text>

    <rect x="118" y="258" width="6" height="6" rx="3" fill="#3388FF" opacity="0.5"/>
    <text x="134" y="266" fill="#5A6B94" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10">Forum: 3 new support threads</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="396" width="1200" height="4" fill="url(#accent)"/>
</svg>
