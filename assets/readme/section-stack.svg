<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="200" viewBox="0 0 1200 200"
     role="img" aria-labelledby="stack-title stack-desc">
  <title id="stack-title">CarRadioWeb Technology Stack</title>
  <desc id="stack-desc">React 19, TypeScript, Node.js, Express, MongoDB, Redis, Tailwind CSS, PrimeReact, Docker</desc>

  <defs>
    <linearGradient id="bg-stack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080C18"/>
      <stop offset="100%" stop-color="#0F1630"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="200" fill="url(#bg-stack)" rx="16"/>

  <!-- Section label -->
  <text x="600" y="28" text-anchor="middle" fill="#3388FF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="600" letter-spacing="2">TECHNOLOGY STACK</text>
  <rect x="540" y="38" width="120" height="2" rx="1" fill="#3388FF"/>

  <!-- Frontend row -->
  <g transform="translate(40, 58)">
    <text x="0" y="0" fill="#F0F4FF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="600">Frontend</text>

    <!-- Chips -->
    <rect x="0" y="14" width="105" height="32" rx="6" fill="#141C3A" stroke="#1E2A50" stroke-width="1"/>
    <text x="52" y="34" text-anchor="middle" fill="#99AAD4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="500">React 19 + TS</text>

    <rect x="114" y="14" width="75" height="32" rx="6" fill="#141C3A" stroke="#1E2A50" stroke-width="1"/>
    <text x="151" y="34" text-anchor="middle" fill="#99AAD4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="500">Vite 7</text>

    <rect x="198" y="14" width="120" height="32" rx="6" fill="#141C3A" stroke="#1E2A50" stroke-width="1"/>
    <text x="258" y="34" text-anchor="middle" fill="#99AAD4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="500">Tailwind 3.4</text>

    <rect x="327" y="14" width="105" height="32" rx="6" fill="#141C3A" stroke="#1E2A50" stroke-width="1"/>
    <text x="379" y="34" text-anchor="middle" fill="#99AAD4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="500">PrimeReact 10</text>

    <rect x="441" y="14" width="105" height="32" rx="6" fill="#141C3A" stroke="#1E2A50" stroke-width="1"/>
    <text x="493" y="34" text-anchor="middle" fill="#99AAD4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="500">Framer Motion</text>

    <rect x="555" y="14" width="120" height="32" rx="6" fill="#141C3A" stroke="#1E2A50" stroke-width="1"/>
    <text x="615" y="34" text-anchor="middle" fill="#99AAD4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="500">i18next (en/zh/ru)</text>
  </g>

  <!-- Backend row -->
  <g transform="translate(40, 108)">
    <text x="0" y="0" fill="#F0F4FF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="600">Backend</text>

    <rect x="0" y="14" width="120" height="32" rx="6" fill="#141C3A" stroke="#1E2A50" stroke-width="1"/>
    <text x="60" y="34" text-anchor="middle" fill="#99AAD4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="500">Node.js + Express</text>

    <rect x="129" y="14" width="105" height="32" rx="6" fill="#141C3A" stroke="#1E2A50" stroke-width="1"/>
    <text x="181" y="34" text-anchor="middle" fill="#99AAD4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="500">MongoDB + Mongoose</text>

    <rect x="243" y="14" width="60" height="32" rx="6" fill="#141C3A" stroke="#1E2A50" stroke-width="1"/>
    <text x="273" y="34" text-anchor="middle" fill="#99AAD4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="500">Redis</text>

    <rect x="312" y="14" width="110" height="32" rx="6" fill="#141C3A" stroke="#1E2A50" stroke-width="1"/>
    <text x="367" y="34" text-anchor="middle" fill="#99AAD4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="500">Alibaba OSS</text>

    <rect x="431" y="14" width="75" height="32" rx="6" fill="#141C3A" stroke="#1E2A50" stroke-width="1"/>
    <text x="468" y="34" text-anchor="middle" fill="#99AAD4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="500">Sentry</text>

    <rect x="515" y="14" width="95" height="32" rx="6" fill="#141C3A" stroke="#1E2A50" stroke-width="1"/>
    <text x="562" y="34" text-anchor="middle" fill="#99AAD4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="500">Docker</text>
  </g>
</svg>
