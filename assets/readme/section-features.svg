<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="230" viewBox="0 0 1200 230"
     role="img" aria-labelledby="feat-title feat-desc">
  <title id="feat-title">CarRadioWeb Capabilities</title>
  <desc id="feat-desc">Product management, knowledge base, AI assistant, admin panel, and Flarum forum support.</desc>

  <defs>
    <linearGradient id="bg-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="230" fill="#0F172A" rx="16"/>

  <text x="600" y="32" text-anchor="middle" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="600" letter-spacing="2">CAPABILITIES</text>

  <g transform="translate(48, 56)">
    <!-- Product Catalog -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="208" height="140" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#3B82F6" opacity="0.12"/>
      <rect x="22" y="22" width="10" height="10" rx="2" fill="#60A5FA"/>
      <rect x="36" y="22" width="10" height="10" rx="2" fill="#60A5FA" opacity="0.7"/>
      <rect x="22" y="36" width="10" height="10" rx="2" fill="#60A5FA" opacity="0.5"/>
      <rect x="36" y="36" width="10" height="10" rx="2" fill="#60A5FA" opacity="0.3"/>
      <text x="66" y="40" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="600">Product Catalog</text>
      <text x="16" y="72" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Vehicle compatibility matrix</text>
      <text x="16" y="92" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Rich product details with</text>
      <text x="16" y="112" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">media &amp; categories</text>
    </g>

    <!-- Knowledge Base -->
    <g transform="translate(224, 0)">
      <rect x="0" y="0" width="208" height="140" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#3B82F6" opacity="0.12"/>
      <rect x="24" y="22" width="20" height="4" rx="1.5" fill="#60A5FA"/>
      <rect x="24" y="30" width="16" height="4" rx="1.5" fill="#60A5FA" opacity="0.6"/>
      <rect x="24" y="38" width="20" height="4" rx="1.5" fill="#60A5FA" opacity="0.4"/>
      <text x="66" y="40" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="600">Knowledge Base</text>
      <text x="16" y="72" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Rich text + video tutorials</text>
      <text x="16" y="92" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Search, categories, drafts</text>
      <text x="16" y="112" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Document feedback system</text>
    </g>

    <!-- AI Assistant -->
    <g transform="translate(448, 0)">
      <rect x="0" y="0" width="208" height="140" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#F59E0B" opacity="0.12"/>
      <circle cx="34" cy="34" r="8" fill="none" stroke="#F59E0B" stroke-width="2"/>
      <path d="M34 28 L34 32" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
      <text x="66" y="40" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="600">AI Assistant</text>
      <text x="16" y="72" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">18+ AI provider support</text>
      <text x="16" y="92" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Knowledge-indexed Q&amp;A</text>
      <text x="16" y="112" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Custom model config</text>
    </g>

    <!-- Admin Dashboard -->
    <g transform="translate(672, 0)">
      <rect x="0" y="0" width="208" height="140" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#3B82F6" opacity="0.12"/>
      <rect x="24" y="22" width="20" height="3" rx="1" fill="#60A5FA"/>
      <rect x="24" y="30" width="14" height="3" rx="1" fill="#60A5FA" opacity="0.5"/>
      <rect x="24" y="38" width="20" height="3" rx="1" fill="#60A5FA" opacity="0.3"/>
      <text x="66" y="40" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="600">Admin Dashboard</text>
      <text x="16" y="72" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">RBAC, audit logs</text>
      <text x="16" y="92" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Visitor analytics</text>
      <text x="16" y="112" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">SEO &amp; module toggles</text>
    </g>

    <!-- Flarum Forum -->
    <g transform="translate(896, 0)">
      <rect x="0" y="0" width="208" height="140" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#3B82F6" opacity="0.12"/>
      <circle cx="34" cy="30" r="4" fill="#60A5FA"/>
      <circle cx="34" cy="42" r="4" fill="#60A5FA" opacity="0.6"/>
      <text x="66" y="40" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="600">Flarum Forum</text>
      <text x="16" y="72" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">One-click Docker deploy</text>
      <text x="16" y="92" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Plugin install/uninstall</text>
      <text x="16" y="112" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Self-hosted extensions</text>
    </g>
  </g>

  <rect x="0" y="226" width="1200" height="4" fill="url(#bg-bar)" opacity="0.3"/>
</svg>
