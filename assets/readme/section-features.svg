<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="260" viewBox="0 0 1200 260"
     role="img" aria-labelledby="features-title features-desc">
  <title id="features-title">CarRadioWeb Key Capabilities</title>
  <desc id="features-desc">Product management, knowledge base, AI assistant, admin panel, forum, analytics — a complete management system for automotive electronics brands.</desc>

  <defs>
    <linearGradient id="bg-feat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080C18"/>
      <stop offset="100%" stop-color="#0F1630"/>
    </linearGradient>
    <linearGradient id="feat-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#3388FF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" fill="url(#bg-feat)" rx="16"/>

  <!-- Section label -->
  <text x="600" y="30" text-anchor="middle" fill="#3388FF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="600" letter-spacing="2">KEY CAPABILITIES</text>
  <rect x="540" y="40" width="120" height="2" rx="1" fill="url(#feat-accent)"/>

  <!-- Feature cards row -->
  <g transform="translate(40, 58)">
    <!-- Card 1: Products -->
    <rect x="0" y="0" width="208" height="170" rx="12" fill="#141C3A" stroke="#1E2A50" stroke-width="1"/>
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#0066FF" opacity="0.15"/>
    <path d="M28 34 L34 28 L46 40" stroke="#3388FF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="34" y="28" width="12" height="12" rx="2" fill="#3388FF" opacity="0.4"/>
    <text x="66" y="42" fill="#F0F4FF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700">Product Catalog</text>
    <text x="16" y="76" fill="#7A8BB4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="400" line-height="1.5">Vehicle compatibility</text>
    <text x="16" y="96" fill="#7A8BB4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">matrix, rich product</text>
    <text x="16" y="116" fill="#7A8BB4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">details with media</text>

    <!-- Card 2: Knowledge -->
    <rect x="228" y="0" width="208" height="170" rx="12" fill="#141C3A" stroke="#1E2A50" stroke-width="1"/>
    <rect x="244" y="16" width="36" height="36" rx="8" fill="#0066FF" opacity="0.15"/>
    <rect x="252" y="24" width="12" height="9" rx="1.5" fill="#3388FF"/>
    <rect x="268" y="24" width="12" height="9" rx="1.5" fill="#3388FF" opacity="0.6"/>
    <line x1="252" y1="38" x2="280" y2="38" stroke="#3388FF" stroke-width="2" stroke-linecap="round"/>
    <text x="294" y="42" fill="#F0F4FF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700">Knowledge Base</text>
    <text x="244" y="76" fill="#7A8BB4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Structured documents</text>
    <text x="244" y="96" fill="#7A8BB4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">with rich text editor,</text>
    <text x="244" y="116" fill="#7A8BB4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">video tutorials, search</text>

    <!-- Card 3: AI Assistant -->
    <rect x="456" y="0" width="208" height="170" rx="12" fill="#141C3A" stroke="#1E2A50" stroke-width="1"/>
    <rect x="472" y="16" width="36" height="36" rx="8" fill="#FF9500" opacity="0.15"/>
    <circle cx="490" cy="34" r="10" fill="none" stroke="#FF9500" stroke-width="2"/>
    <path d="M490 28 L490 32" stroke="#FF9500" stroke-width="2" stroke-linecap="round"/>
    <text x="522" y="42" fill="#F0F4FF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700">AI Assistant</text>
    <text x="472" y="76" fill="#7A8BB4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">18+ AI providers,</text>
    <text x="472" y="96" fill="#7A8BB4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">knowledge-indexed Q&amp;A,</text>
    <text x="472" y="116" fill="#7A8BB4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">custom model support</text>

    <!-- Card 4: Admin Panel -->
    <rect x="684" y="0" width="208" height="170" rx="12" fill="#141C3A" stroke="#1E2A50" stroke-width="1"/>
    <rect x="700" y="16" width="36" height="36" rx="8" fill="#0066FF" opacity="0.15"/>
    <rect x="706" y="22" width="16" height="12" rx="2" fill="#3388FF"/>
    <rect x="706" y="38" width="16" height="2" rx="1" fill="#3388FF" opacity="0.5"/>
    <line x1="728" y1="28" x2="736" y2="28" stroke="#3388FF" stroke-width="2" stroke-linecap="round"/>
    <line x1="728" y1="34" x2="736" y2="34" stroke="#3388FF" stroke-width="2" stroke-linecap="round"/>
    <line x1="728" y1="40" x2="736" y2="40" stroke="#3388FF" stroke-width="2" stroke-linecap="round"/>
    <text x="750" y="42" fill="#F0F4FF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700">Admin Panel</text>
    <text x="700" y="76" fill="#7A8BB4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Full RBAC, audit logs,</text>
    <text x="700" y="96" fill="#7A8BB4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">visitor analytics, SEO,</text>
    <text x="700" y="116" fill="#7A8BB4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">module toggles</text>

    <!-- Card 5: Forum -->
    <rect x="912" y="0" width="208" height="170" rx="12" fill="#141C3A" stroke="#1E2A50" stroke-width="1"/>
    <rect x="928" y="16" width="36" height="36" rx="8" fill="#0066FF" opacity="0.15"/>
    <circle cx="946" cy="34" r="8" fill="none" stroke="#3388FF" stroke-width="2"/>
    <circle cx="946" cy="34" r="3" fill="#3388FF"/>
    <text x="978" y="42" fill="#F0F4FF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700">Forum (Flarum)</text>
    <text x="928" y="76" fill="#7A8BB4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">One-click Docker deploy,</text>
    <text x="928" y="96" fill="#7A8BB4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">plugin management,</text>
    <text x="928" y="116" fill="#7A8BB4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">self-hosted extensions</text>
  </g>

  <rect x="0" y="256" width="1200" height="4" fill="url(#feat-accent)" opacity="0.3"/>
</svg>
