<svg xmlns="http://www.w3.org/2000/svg"
     width="420" height="64" viewBox="0 0 420 64"
     role="img" aria-labelledby="credit-title credit-desc">
  <title id="credit-title">README made with beautify-github-readme</title>
  <desc id="credit-desc">This README was redesigned using the beautify-github-readme Skill.</desc>

  <defs>
    <linearGradient id="credit-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141C3A"/>
      <stop offset="100%" stop-color="#0F1630"/>
    </linearGradient>
  </defs>

  <rect width="420" height="64" rx="10" fill="url(#credit-grad)" stroke="#1E2A50" stroke-width="1"/>

  <!-- Blue dot motif -->
  <circle cx="20" cy="32" r="4" fill="#0066FF" opacity="0.5"/>
  <circle cx="20" cy="32" r="2" fill="#3388FF"/>

  <text x="36" y="29" fill="#5A6B94" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="500" letter-spacing="1">README MADE WITH</text>
  <text x="36" y="47" fill="#99AAD4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="500">beautify-github-readme</text>

  <!-- Outbound arrow -->
  <path d="M372 24 L392 24 L392 44" stroke="#3388FF" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M372 44 L392 24" stroke="#3388FF" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
